{% extends 'base.html' %}

{% block content %}
    <div class="row text-center">
        {% for product in products %}
        <div class="col-3">
            <div class="card mb-4 box-shadow">
                <img src="{{ product.image.url }}" class="img-fluid rounded" style="height: 200px; width: 200px;" alt="{{ product.name }}">
                <div class="card-header">
                    <h4 class="my-0 font-weight-normal">{{ product.name }}</h4>
                </div>
                <div class="card-body">
                    <h1 class="card-title pricing-card-title">{{ product.price }}</h1>
                    <ul class="list-unstyled mt-3 mb-4 text-start m-3">
                        <li>- {{ product.description|slice:":100" }}</li>
                        <li>- {{ product.category }}</li>
                    </ul>
                    <a href="{% url 'catalog:product_detail' product.id %}" class="btn btn-lg btn-block btn-outline-primary">Купить</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
{% endblock %}
