{% extends 'base.html' %}


{% block content %}
<div class="container mt-5">
    <h2 class="mb-4">Список категорий продуктов</h2>

    <div class="list-group">
        {% for category in categories %}
            <a href="{% url 'catalog:category_products' category.id %}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                <span class="fw-bold">{{ category.name }}</span>
                <span class="btn btn-sm btn-outline-primary">Посмотреть товары</span>
            </a>
        {% empty %}
            <div class="alert alert-warning">Категории еще не добавлены.</div>
        {% endfor %}
    </div>
</div>
{% endblock %}
