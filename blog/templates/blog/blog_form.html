{% extends 'base.html' %}

{% block content %}
<h2>Форма для статьи</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{% url 'blog:blog_list'%}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
