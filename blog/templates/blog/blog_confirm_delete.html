{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h2>Удаление статьи</h2>
    <p>Вы уверены, что хотите удалить статью "{{ blog.title }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'blog:blog_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
