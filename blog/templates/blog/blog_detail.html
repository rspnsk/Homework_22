{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h1>{{ post.title }}</h1>
    <img src="{{ post.preview.url }}" class="img-fluid rounded" style="max-height: 400px; width: 100%; object-fit: contain;" alt="{{ post.title }}">
    <p>Опубликовано: {{ post.created_at|date:"d-m-Y" }}</p>
    <p>Просмотров: {{ post.views_count }}</p>
    <p>{{ post.content|linebreaks }}</p>
    <a href="{% url 'blog:blog_update' post.pk %}" class="btn btn-warning">Редактировать</a>
    <a href="{% url 'blog:blog_delete' post.pk %}" class="btn btn-danger">Удалить</a>
</div>
{% endblock %}
