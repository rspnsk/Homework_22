{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h1>Блог Skystore</h1>
    <a href="{% url 'blog:new' %}" class="btn btn-success mb-3">Написать статью</a>
    <div class="row">
        {% for post in posts %}
        <div class="col-md-4">
            <div class="card mb-4 shadow-sm">
                <img src="{{ post.preview.url }}" class="bd-placeholder-img card-img-top" style="height: 200px; width: 100%; object-fit: cover;" alt="{{ post.title }}">
                <div class="card-body">
                    <h5 class="card-title">{{ post.title }}</h5>
                    <p class="card-text">{{ post.content|truncatewords:30 }}</p>
                    <a href="{% url 'blog:blog_detail' post.pk %}" class="btn btn-primary">Читать далее</a>
                </div>
            </div>
        </div>
        {% empty %}
        <p>Пока нет публикаций.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
